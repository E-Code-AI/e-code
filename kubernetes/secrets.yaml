# WARNING: Do not commit real secrets. Use sealed-secrets or external-secrets-operator in production.
# Secrets for E-Code Platform
# NOTE: In production, use Google Secret Manager or sealed-secrets
apiVersion: v1
kind: Secret
metadata:
  name: e-code-secrets
  namespace: e-code-platform
type: Opaque
stringData:
  # IMPORTANT: Replace with values from Google Secret Manager or HashiCorp Vault
  # Do NOT commit real values to version control
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  DATABASE_URL: "${DATABASE_URL}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
  VITE_STRIPE_PUBLIC_KEY: "${VITE_STRIPE_PUBLIC_KEY}"
  SESSION_SECRET: "${SESSION_SECRET}"
  JWT_SECRET: "${JWT_SECRET}"
