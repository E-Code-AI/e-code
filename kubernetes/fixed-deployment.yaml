# WARNING: Do not commit real secrets. Use sealed-secrets or external-secrets-operator in production.
# Fixed deployment configuration for existing GKE cluster
apiVersion: v1
kind: ConfigMap
metadata:
  name: e-code-config
  namespace: e-code-platform
data:
  NODE_ENV: "production"
  PORT: "5000"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "ecode"
  REDIS_HOST: "redis-service"  
  REDIS_PORT: "6379"
  CORS_ORIGIN: "https://ecode.cloud,https://*.ecode.cloud"
  REPLIT_DOMAINS: "35.189.194.33"
  ISSUER_URL: "https://replit.com/oidc"
  REPL_ID: "e-code-platform"

---
apiVersion: v1
kind: Secret
metadata:
  name: e-code-secrets
  namespace: e-code-platform
type: Opaque
stringData:
  # IMPORTANT: Replace with values from Google Secret Manager or HashiCorp Vault
  # Do NOT commit real values to version control
  DATABASE_URL: "${DATABASE_URL}"
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  PGDATABASE: "${PGDATABASE}"
  PGHOST: "${PGHOST}"
  PGPASSWORD: "${PGPASSWORD}"
  PGPORT: "${PGPORT}"
  PGUSER: "${PGUSER}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
  VITE_STRIPE_PUBLIC_KEY: "${VITE_STRIPE_PUBLIC_KEY}"
  SESSION_SECRET: "${SESSION_SECRET}"
  JWT_SECRET: "${JWT_SECRET}"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-code-platform
  namespace: e-code-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e-code-platform
  template:
    metadata:
      labels:
        app: e-code-platform
    spec:
      containers:
      - name: e-code-platform
        # Replace with specific version tag in production
        image: ${CONTAINER_REGISTRY}/${PROJECT_ID}/e-code-platform:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: e-code-config
        - secretRef:
            name: e-code-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /api/monitoring/health
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/monitoring/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: e-code-platform
  namespace: e-code-platform
spec:
  type: LoadBalancer
  selector:
    app: e-code-platform
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
