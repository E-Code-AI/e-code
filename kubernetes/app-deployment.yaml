# =============================================================================
# E-Code Platform Main Application Deployment
# =============================================================================
# VARIABLE SUBSTITUTION:
# This file uses envsubst-style variables that must be replaced before applying.
#
# Required environment variables:
#   CONTAINER_REGISTRY - Container registry URL (e.g., gcr.io, docker.io)
#   PROJECT_ID         - GCP project ID or organization name
#   IMAGE_TAG          - Docker image tag (e.g., v1.2.3, latest, sha-abc123)
#
# Example usage:
#   export CONTAINER_REGISTRY=gcr.io
#   export PROJECT_ID=my-project
#   export IMAGE_TAG=$(git rev-parse --short HEAD)
#   envsubst < kubernetes/app-deployment.yaml | kubectl apply -f -
#
# For CI/CD pipelines, these are typically set from:
#   - GitHub Actions: ${{ secrets.CONTAINER_REGISTRY }}
#   - GitLab CI: $CI_REGISTRY
#   - Jenkins: ${env.CONTAINER_REGISTRY}
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e-code-app-sa
  namespace: e-code-platform
  labels:
    app: e-code

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e-code-app-role
  namespace: e-code-platform
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e-code-app-rolebinding
  namespace: e-code-platform
subjects:
- kind: ServiceAccount
  name: e-code-app-sa
  namespace: e-code-platform
roleRef:
  kind: Role
  name: e-code-app-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: e-code-typescript-pdb
  namespace: e-code-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: e-code
      component: typescript-core

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-code-typescript
  namespace: e-code-platform
  labels:
    app: e-code
    component: typescript-core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: e-code
      component: typescript-core
  template:
    metadata:
      labels:
        app: e-code
        component: typescript-core
    spec:
      serviceAccountName: e-code-app-sa
      containers:
      - name: typescript-core
        # IMAGE_TAG SUBSTITUTION: Replace ${IMAGE_TAG} with actual tag before applying
        # Use: envsubst < app-deployment.yaml | kubectl apply -f -
        # Or set in CI/CD: IMAGE_TAG=${{ github.sha }} or IMAGE_TAG=$(git describe --tags)
        image: ${CONTAINER_REGISTRY}/${PROJECT_ID}/e-code-platform:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: SERVICE_TYPE
          value: "typescript"
        - name: PORT
          value: "5000"
        envFrom:
        - configMapRef:
            name: e-code-config
        - secretRef:
            name: e-code-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /api/monitoring/health
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/monitoring/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-code-go-runtime
  namespace: e-code-platform
  labels:
    app: e-code
    component: go-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: e-code
      component: go-runtime
  template:
    metadata:
      labels:
        app: e-code
        component: go-runtime
    spec:
      containers:
      - name: go-runtime
        # Replace with specific version tag in production
        image: ${CONTAINER_REGISTRY}/${PROJECT_ID}/e-code-go-runtime:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SERVICE_TYPE
          value: "go-runtime"
        - name: PORT
          value: "8080"
        envFrom:
        - configMapRef:
            name: e-code-config
        - secretRef:
            name: e-code-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /api/monitoring/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/monitoring/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-code-python-ml
  namespace: e-code-platform
  labels:
    app: e-code
    component: python-ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: e-code
      component: python-ml
  template:
    metadata:
      labels:
        app: e-code
        component: python-ml
    spec:
      containers:
      - name: python-ml
        # Replace with specific version tag in production
        image: ${CONTAINER_REGISTRY}/${PROJECT_ID}/e-code-python-ml:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: SERVICE_TYPE
          value: "python-ml"
        - name: PORT
          value: "8081"
        envFrom:
        - configMapRef:
            name: e-code-config
        - secretRef:
            name: e-code-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /api/monitoring/health
            port: 8081
          initialDelaySeconds: 40
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/monitoring/health
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-code-mcp-server
  namespace: e-code-platform
  labels:
    app: e-code
    component: mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: e-code
      component: mcp-server
  template:
    metadata:
      labels:
        app: e-code
        component: mcp-server
    spec:
      containers:
      - name: mcp-server
        # Replace with specific version tag in production
        image: ${CONTAINER_REGISTRY}/${PROJECT_ID}/e-code-mcp:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 3200
          name: http
        env:
        - name: SERVICE_TYPE
          value: "mcp-server"
        - name: PORT
          value: "3200"
        envFrom:
        - configMapRef:
            name: e-code-config
        - secretRef:
            name: e-code-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        readinessProbe:
          httpGet:
            path: /api/monitoring/health
            port: 3200
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/monitoring/health
            port: 3200
          initialDelaySeconds: 30
          periodSeconds: 10
