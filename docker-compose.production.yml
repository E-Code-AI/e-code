# E-Code Platform Production Docker Compose
# Full configuration with Docker-in-Docker for code execution

version: '3.8'

services:
  app:
    build: .
    ports:
      - "80:5000"    # HTTP: External port 80 → Internal port 5000
      - "443:5000"   # HTTPS: External port 443 → Internal port 5000 (with SSL termination)
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./attached_assets:/app/attached_assets
      - docker-certs-client:/certs/client:ro
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/monitoring/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${PGDATABASE:-ecode}
      - POSTGRES_USER=${PGUSER:-ecode_user}
      - POSTGRES_PASSWORD=${PGPASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-ecode_user} -d ${PGDATABASE:-ecode}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  docker:
    image: docker:24-dind
    container_name: ecode-docker
    restart: unless-stopped
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - docker-certs-ca:/certs/ca
      - docker-certs-client:/certs/client
      - docker-data:/var/lib/docker
    networks:
      - ecode-network

volumes:
  postgres-data:
  redis-data:
  docker-certs-ca:
  docker-certs-client:
  docker-data:

networks:
  ecode-network:
    driver: bridge