<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F26207"/>
      <stop offset="100%" style="stop-color:#FF8534"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bgGradient)"/>
  
  <!-- Code bracket left -->
  <path d="M160 256 L100 200 L100 180 L180 256 L100 332 L100 312 Z" 
        fill="url(#accentGradient)" 
        filter="url(#shadow)"/>
  
  <!-- Code bracket right -->
  <path d="M352 256 L412 200 L412 180 L332 256 L412 332 L412 312 Z" 
        fill="url(#accentGradient)" 
        filter="url(#shadow)"/>
  
  <!-- E letter -->
  <g transform="translate(196, 150)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="24" rx="4" fill="#fff"/>
    <rect x="0" y="94" width="120" height="24" rx="4" fill="#fff"/>
    <rect x="0" y="188" width="120" height="24" rx="4" fill="#fff"/>
    <rect x="0" y="0" width="24" height="212" rx="4" fill="#fff"/>
  </g>
  
  <!-- AI spark -->
  <circle cx="380" cy="120" r="16" fill="#F26207" opacity="0.8"/>
  <circle cx="380" cy="120" r="8" fill="#fff"/>
</svg>
