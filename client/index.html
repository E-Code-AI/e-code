<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>E-Code - Code, Create, and Learn Together</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" type="image/x-icon" />
    <meta name="description" content="E-Code is where people create software, learn to code, and build their ideas. With zero setup and instant collaboration." />
    
    <!-- Fortune 500 Performance: Critical Resource Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.anthropic.com">
    <link rel="dns-prefetch" href="https://api.openai.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    
    <!-- IBM Plex Fonts - Optimized Loading -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0D1117">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="E-Code">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    
    <!-- Fortune 500: Instant Loading Skeleton Styles - Unified with React ECodeLoading -->
    <style>
      /* Critical CSS - Inline for instant render */
      :root {
        --skeleton-bg: #1C2333;
        --skeleton-shine: rgba(255,255,255,0.05);
        --primary: #F26207;
        --primary-light: #F99D25;
        --text-secondary: #9ca3af;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --skeleton-bg: #ffffff;
          --skeleton-shine: rgba(255,255,255,0.8);
          --text-secondary: #6b7280;
        }
      }
      body {
        margin: 0;
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--skeleton-bg);
        min-height: 100vh;
      }
      /* Initial loading state - matches React ECodeLoading component */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--skeleton-bg);
        z-index: 9999;
        gap: 12px;
      }
      .initial-loader .logo-container {
        position: relative;
        width: 64px;
        height: 64px;
      }
      .initial-loader .spinner-ring {
        position: absolute;
        inset: 0;
        animation: spin 1s linear infinite;
      }
      .initial-loader .logo-static {
        position: absolute;
        inset: 0;
      }
      .initial-loader .pulse-bg {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        opacity: 0.2;
        animation: pulse 2s ease-in-out infinite;
      }
      .initial-loader .text {
        color: var(--text-secondary);
        font-size: 16px;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      /* Hide loader once React renders */
      #root:not(:empty) + .initial-loader,
      .initial-loader.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="initial-loader" id="initial-loader">
      <div class="logo-container">
        <!-- Spinning ring - matches React ECodeLoading -->
        <svg class="spinner-ring" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" fill="none" stroke="url(#html-ring-gradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 30" opacity="0.8"/>
          <defs>
            <linearGradient id="html-ring-gradient" x1="0" y1="0" x2="40" y2="40">
              <stop offset="0%" stop-color="#F26207"/>
              <stop offset="100%" stop-color="#F99D25"/>
            </linearGradient>
          </defs>
        </svg>
        <!-- Static E-Code logo - matches React ECodeLoading -->
        <svg class="logo-static" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="14" fill="url(#html-logo-gradient)"/>
          <path d="M14 12 L14 20 L14 28 M14 12 L22 12 M14 20 L20 20 M14 28 L22 28" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M26 16 L30 20 L26 24" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="html-logo-gradient" x1="0" y1="0" x2="40" y2="40">
              <stop offset="0%" stop-color="#F26207"/>
              <stop offset="100%" stop-color="#F99D25"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="pulse-bg"></div>
      </div>
      <div class="text" id="loading-text">Loading...</div>
    </div>
    <script>
      // Fallback: Update text after timeout, show error state if React hasn't mounted
      (function() {
        var startTime = Date.now();
        var loadingText = document.getElementById('loading-text');
        var loader = document.getElementById('initial-loader');
        
        // Update loading text with dots animation
        var dotCount = 0;
        var progressInterval = setInterval(function() {
          dotCount = (dotCount + 1) % 4;
          var dots = '.'.repeat(dotCount || 1);
          var elapsed = Math.round((Date.now() - startTime) / 1000);
          if (elapsed > 10) {
            loadingText.textContent = 'Loading' + dots + ' (' + elapsed + 's)';
          } else {
            loadingText.textContent = 'Loading' + dots;
          }
        }, 500);
        
        // After 60 seconds, show an error message but don't block the app
        setTimeout(function() {
          clearInterval(progressInterval);
          var root = document.getElementById('root');
          if (!root || !root.hasChildNodes()) {
            loadingText.textContent = 'Taking longer than expected...';
            loadingText.style.color = '#f59e0b';
            
            // Add refresh button
            var refreshBtn = document.createElement('button');
            refreshBtn.textContent = 'Refresh Page';
            refreshBtn.style.cssText = 'margin-top:16px;padding:8px 16px;background:#F26207;color:white;border:none;border-radius:6px;cursor:pointer;font-family:inherit;';
            refreshBtn.onclick = function() { window.location.reload(); };
            loader.appendChild(refreshBtn);
          }
        }, 60000);
        
        // After 90 seconds, force hide the loader
        setTimeout(function() {
          clearInterval(progressInterval);
          if (loader) loader.classList.add('hidden');
        }, 90000);
      })();
    </script>
    <script>
      // Critical fix for WebSocket issues in development
      // Suppresses connection errors, fixes undefined port issues, and rewrites Vite HMR URLs for mobile
      (function() {
        if (typeof window === 'undefined' || !window.WebSocket) return;
        
        const isDevelopment = window.location.hostname === 'localhost' || 
                              window.location.hostname.includes('replit.dev') ||
                              window.location.port === '5173';
        
        // Detect if we're on a Replit domain (not localhost)
        const isReplitRemote = window.location.hostname.includes('replit.dev') ||
                               window.location.hostname.includes('repl.co') ||
                               window.location.hostname.includes('picard.replit.dev') ||
                               window.location.hostname.includes('riker.replit.dev');
        
        const OriginalWebSocket = window.WebSocket;
        
        // Create a mock WebSocket that fails silently in development
        class MockWebSocket {
          constructor(url, protocols) {
            this.url = url;
            this.protocols = protocols;
            this.readyState = WebSocket.CONNECTING;
            this._eventListeners = {};
            
            // Silently fail in development
            setTimeout(() => {
              this.readyState = WebSocket.CLOSED;
              if (this.onclose) {
                this.onclose({ code: 1000, reason: 'Development mode - WebSocket disabled' });
              }
            }, 0);
          }
          
          send(data) {}
          close() { this.readyState = WebSocket.CLOSED; }
          addEventListener(type, listener) {
            if (!this._eventListeners[type]) this._eventListeners[type] = [];
            this._eventListeners[type].push(listener);
          }
          removeEventListener(type, listener) {
            if (this._eventListeners[type]) {
              this._eventListeners[type] = this._eventListeners[type].filter(l => l !== listener);
            }
          }
        }
        
        MockWebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
        MockWebSocket.OPEN = OriginalWebSocket.OPEN;
        MockWebSocket.CLOSING = OriginalWebSocket.CLOSING;
        MockWebSocket.CLOSED = OriginalWebSocket.CLOSED;
        
        // Rewrite Vite HMR localhost URLs to use the current Replit domain
        function rewriteViteHMRUrl(url) {
          try {
            // Check if this is a localhost Vite HMR URL
            if (url.includes('localhost:5173') || url.includes('127.0.0.1:5173')) {
              const parsed = new URL(url);
              // Rewrite to current host with WSS protocol
              const newUrl = 'wss://' + window.location.hostname + parsed.pathname + parsed.search;
              console.log('[WebSocket] Rewrote Vite HMR URL for mobile:', url.substring(0, 50), '->', newUrl.substring(0, 60));
              return newUrl;
            }
          } catch (e) {
            console.warn('[WebSocket] Failed to rewrite URL:', e);
          }
          return url;
        }
        
        const ProxyWebSocket = new Proxy(OriginalWebSocket, {
          construct: function(target, args) {
            let url = args[0];
            const protocols = args[1];
            
            if (typeof url === 'string') {
              // Fix URLs with undefined port
              if (url.includes(':undefined') || url.includes('localhost:undefined')) {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const host = window.location.host;
                
                if (url.includes('localhost:undefined')) {
                  const match = url.match(/localhost:undefined(.*)/);
                  const pathAndQuery = match ? match[1] : '';
                  url = protocol + '//' + host + pathAndQuery;
                } else if (url.includes(':undefined')) {
                  url = url.replace(':undefined', ':' + (window.location.port || '5000'));
                }
              }
              
              const isViteHMR = url.includes('/@vite') || url.includes('__vite') || url.includes('?token=');
              const isEssentialWebSocket = url.includes('/ws/agent') || 
                                           url.includes('channel=agent') ||
                                           url.includes('/api/terminal/ws') ||
                                           url.includes('/ws/collaboration') ||
                                           url.includes('/ws/background-tests') ||
                                           url.includes('/api/runtime/logs/ws');
              
              // CRITICAL FIX: Rewrite localhost Vite HMR URLs when on Replit remote domain
              if (isReplitRemote && isViteHMR && (url.includes('localhost:5173') || url.includes('127.0.0.1:5173'))) {
                url = rewriteViteHMRUrl(url);
              }
              
              console.log('[WebSocket] Connection:', url.substring(0, 80), '| HMR:', isViteHMR, '| Essential:', isEssentialWebSocket);
              
              if (isDevelopment && !isViteHMR && !isEssentialWebSocket) {
                console.log('[WebSocket] Suppressed non-essential connection');
                return new MockWebSocket(url, protocols);
              }
            }
            
            return new target(url, protocols);
          }
        });
        
        ProxyWebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
        ProxyWebSocket.OPEN = OriginalWebSocket.OPEN;
        ProxyWebSocket.CLOSING = OriginalWebSocket.CLOSING;
        ProxyWebSocket.CLOSED = OriginalWebSocket.CLOSED;
        
        window.WebSocket = ProxyWebSocket;
        
        console.log('[WebSocket] Interceptor installed | Dev:', isDevelopment, '| Replit:', isReplitRemote);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
