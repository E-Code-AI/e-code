<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Code Desktop Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0d10;
        color: #e7edf3;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(560px, calc(100vw - 48px));
        border: 1px solid #26313d;
        border-radius: 8px;
        background: #11161d;
        padding: 28px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 650;
      }
      p {
        margin: 0 0 18px;
        color: #a9b6c4;
        line-height: 1.5;
      }
      button {
        height: 36px;
        border: 1px solid #3a4654;
        border-radius: 6px;
        background: #1c2733;
        color: #e7edf3;
        padding: 0 14px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #263445;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>E-Code Desktop</h1>
      <p>
        The local React bundle is not built yet and the cloud shell is unavailable. Build the app with
        <code>npm run build</code>, then reopen E-Code Desktop for offline local projects.
      </p>
      <button id="open-folder">Open Local Folder</button>
    </main>
    <script>
      document.getElementById('open-folder').addEventListener('click', async () => {
        if (window.electronAPI?.openLocalProjectDialog) {
          await window.electronAPI.openLocalProjectDialog();
        }
      });
    </script>
  </body>
</html>
