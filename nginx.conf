# E-Code Nginx Configuration
# Supports: standalone, Docker, and Kubernetes deployments

# Upstream definitions - change based on deployment mode
# For standalone/Replit: localhost:5000
# For Docker Compose: app:5000
# For Kubernetes: ecode-app-service:5000
upstream ecode_backend {
    # Default: Docker Compose service name
    server app:5000;
    
    # Fallback servers for high availability (Kubernetes)
    # server ecode-app-service:5000 backup;
    
    keepalive 32;
}

server {
    listen 80;
    server_name e-code.ai www.e-code.ai;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name e-code.ai www.e-code.ai;

    ssl_certificate /etc/letsencrypt/live/e-code.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-code.ai/privkey.pem;
    
    # SSL optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # CSP: Hash-based policy for inline scripts (more secure than nonce with nginx)
    # Note: Application should generate actual script hashes and update this header
    # For development, using 'unsafe-inline' with strict-dynamic
    # Production should use specific script hashes or move all scripts to external files
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'strict-dynamic' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    location / {
        proxy_pass http://ecode_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # Timeouts for long-running requests (AI operations)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ws {
        proxy_pass http://ecode_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSocket timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Health check endpoint (for load balancers)
    location /health {
        proxy_pass http://ecode_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    client_max_body_size 100M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
}