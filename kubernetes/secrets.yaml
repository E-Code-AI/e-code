# =============================================================================
# E-CODE KUBERNETES SECRETS TEMPLATE
# =============================================================================
# WARNING: This is a TEMPLATE file. Do NOT apply directly to Kubernetes!
#
# USAGE (choose one method):
#
# Method 1: Use envsubst (requires env vars to be set)
#   export POSTGRES_USER=myuser POSTGRES_PASSWORD=mypass ...
#   envsubst < kubernetes/secrets.yaml | kubectl apply -f -
#
# Method 2: Use External Secrets Operator (recommended for production)
#   See: kubernetes/external-secrets.yaml
#
# Method 3: Use Sealed Secrets
#   kubeseal --format=yaml < secrets.yaml > sealed-secrets.yaml
#
# NEVER commit real secret values to version control!
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: e-code-secrets
  namespace: e-code-platform
  labels:
    app: e-code
    component: secrets
type: Opaque
stringData:
  # =============================================================================
  # ENVSUBST SUBSTITUTION GUIDE
  # =============================================================================
  # These placeholders use shell variable syntax ${VAR_NAME} and MUST be
  # substituted before applying to Kubernetes.
  #
  # STEP-BY-STEP USAGE:
  # 1. Export all required environment variables:
  #    export POSTGRES_USER="myuser"
  #    export POSTGRES_PASSWORD="$(openssl rand -base64 32)"
  #    export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-service:5432/ecode"
  #    export REDIS_PASSWORD="$(openssl rand -base64 32)"
  #    export SESSION_SECRET="$(openssl rand -base64 64)"
  #    export JWT_SECRET="$(openssl rand -base64 64)"
  #    export OPENAI_API_KEY="sk-..."
  #    export STRIPE_SECRET_KEY="sk_live_..."
  #    export VITE_STRIPE_PUBLIC_KEY="pk_live_..."
  #
  # 2. Apply with envsubst:
  #    envsubst < kubernetes/secrets.yaml | kubectl apply -f -
  #
  # 3. Verify secrets were created:
  #    kubectl get secrets -n e-code-platform
  #    kubectl describe secret e-code-secrets -n e-code-platform
  #
  # IMPORTANT: Never commit actual secret values to version control!
  # For production, use External Secrets Operator or Sealed Secrets instead.
  # =============================================================================
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  DATABASE_URL: "${DATABASE_URL}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
  VITE_STRIPE_PUBLIC_KEY: "${VITE_STRIPE_PUBLIC_KEY}"
  SESSION_SECRET: "${SESSION_SECRET}"
  JWT_SECRET: "${JWT_SECRET}"
