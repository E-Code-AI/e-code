<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Code Todo App - E2E Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📝 E-Code Todo App</h1>
        <p class="subtitle">Complete E2E Test Application</p>
        
        <div class="input-section">
            <input type="text" id="todoInput" placeholder="Add a new task..." autocomplete="off">
            <button id="addBtn" onclick="addTodo()">Add</button>
        </div>
        
        <div class="stats">
            <span id="totalCount">0 tasks</span> | 
            <span id="completedCount">0 completed</span>
        </div>
        
        <ul id="todoList"></ul>
        
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
