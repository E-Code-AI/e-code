# =============================================================================
# E-CODE EXTERNAL SECRETS OPERATOR CONFIG (PRODUCTION RECOMMENDED)
# =============================================================================
# Prerequisites:
#   1. Install External Secrets Operator: https://external-secrets.io/
#   2. Configure a SecretStore for your provider (GCP, AWS, Azure, Vault)
#
# This fetches secrets from Google Secret Manager at runtime
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: e-code-platform
spec:
  provider:
    gcpsm:
      projectID: ${GCP_PROJECT_ID}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: e-code-secrets
  namespace: e-code-platform
  labels:
    app: e-code
    component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: e-code-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: e-code-postgres-user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: e-code-postgres-password
    - secretKey: DATABASE_URL
      remoteRef:
        key: e-code-database-url
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: e-code-redis-password
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: e-code-openai-api-key
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: e-code-stripe-secret-key
    - secretKey: VITE_STRIPE_PUBLIC_KEY
      remoteRef:
        key: e-code-stripe-public-key
    - secretKey: SESSION_SECRET
      remoteRef:
        key: e-code-session-secret
    - secretKey: JWT_SECRET
      remoteRef:
        key: e-code-jwt-secret
