version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: e-code-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - postgres
      - redis
    networks:
      - e-code-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: e-code-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ecode
      - POSTGRES_USER=ecode
      - POSTGRES_PASSWORD=ecode_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - e-code-network

  redis:
    image: redis:7-alpine
    container_name: e-code-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - e-code-network

networks:
  e-code-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
