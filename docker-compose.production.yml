# E-Code Platform Production Docker Compose
# Full configuration with Docker-in-Docker for code execution

version: '3.8'

services:
  # =============================================================================
  # NGINX REVERSE PROXY WITH SSL TERMINATION
  # =============================================================================
  # Handles all incoming HTTP/HTTPS traffic and terminates SSL before proxying
  # to the backend application. Uses Let's Encrypt for SSL certificates.
  # =============================================================================
  nginx:
    image: nginx:alpine
    container_name: ecode-nginx-prod
    ports:
      - "80:80"      # HTTP (redirects to HTTPS)
      - "443:443"    # HTTPS with SSL termination
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecode-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for automatic SSL certificate renewal
  certbot:
    image: certbot/certbot
    container_name: ecode-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - ecode-network

  app:
    build: .
    # Internal port - nginx handles external traffic
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}@redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./attached_assets:/app/attached_assets
      - docker-certs-client:/certs/client:ro
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/monitoring/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${PGDATABASE:-ecode}
      - POSTGRES_USER=${PGUSER:-ecode_user}
      - POSTGRES_PASSWORD=${PGPASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-ecode_user} -d ${PGDATABASE:-ecode}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  docker:
    image: docker:24-dind
    container_name: ecode-docker
    restart: unless-stopped
    privileged: true  # Required for Docker-in-Docker
    security_opt:
      - seccomp:unconfined
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - docker-certs-ca:/certs/ca
      - docker-certs-client:/certs/client
      - docker-data:/var/lib/docker
    networks:
      - ecode-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

volumes:
  postgres-data:
  redis-data:
  docker-certs-ca:
  docker-certs-client:
  docker-data:

networks:
  ecode-network:
    driver: bridge