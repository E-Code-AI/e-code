# E-Code Platform Production Docker Compose
# Full configuration with Docker-in-Docker for code execution

version: '3.8'

services:
  # =============================================================================
  # NGINX REVERSE PROXY WITH SSL TERMINATION
  # =============================================================================
  # Handles all incoming HTTP/HTTPS traffic and terminates SSL before proxying
  # to the backend application. Uses Let's Encrypt for SSL certificates.
  # =============================================================================
  nginx:
    image: nginx:alpine
    container_name: ecode-nginx-prod
    ports:
      - "80:80"      # HTTP (redirects to HTTPS)
      - "443:443"    # HTTPS with SSL termination
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecode-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for automatic SSL certificate renewal
  certbot:
    image: certbot/certbot
    container_name: ecode-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - ecode-network

  app:
    build: .
    container_name: ecode-app-prod
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${PGUSER:-ecode_user}:${PGPASSWORD:?PGPASSWORD must be set in production}@postgres:5432/${PGDATABASE:-ecode}?sslmode=disable
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${PGUSER:-ecode_user}
      - PGPASSWORD=${PGPASSWORD:?PGPASSWORD must be set in production}
      - PGDATABASE=${PGDATABASE:-ecode}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set in production}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}@redis:6379
      - REDIS_ENABLED=true
      - RUNNER_BASE_URL=http://runner:4000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in production}
      - RUNNER_JWT_SECRET=${RUNNER_JWT_SECRET:?RUNNER_JWT_SECRET must be set for runner auth}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://e-code.ai,https://www.e-code.ai}
      - APP_URL=${APP_URL:-https://e-code.ai}
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./attached_assets:/app/attached_assets
      - docker-certs-client:/certs/client:ro
    networks:
      - ecode-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${PGDATABASE:-ecode}
      - POSTGRES_USER=${PGUSER:-ecode_user}
      - POSTGRES_PASSWORD=${PGPASSWORD:?PGPASSWORD must be set in production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-ecode_user} -d ${PGDATABASE:-ecode}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    container_name: ecode-runner-prod
    expose:
      - "4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - RUNNER_JWT_SECRET=${RUNNER_JWT_SECRET:?RUNNER_JWT_SECRET must be set for runner auth}
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
    depends_on:
      docker:
        condition: service_started
    restart: unless-stopped
    volumes:
      - docker-certs-client:/certs/client:ro
    networks:
      - ecode-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  docker:
    image: docker:24-dind
    container_name: ecode-docker
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp:unconfined
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - docker-certs-ca:/certs/ca
      - docker-certs-client:/certs/client
      - docker-data:/var/lib/docker
    networks:
      - ecode-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

volumes:
  postgres-data:
  redis-data:
  docker-certs-ca:
  docker-certs-client:
  docker-data:

networks:
  ecode-network:
    driver: bridge