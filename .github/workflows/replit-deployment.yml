name: Replit Deployment Pipeline

# Optimized CI/CD for Replit Cloud Run deployment
# Fortune 500 Production Standards

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20.x'
  REPLIT_API_URL: 'https://replit.com/graphql'

jobs:
  # Job 1: Code Quality & Security Checks
  quality-and-security:
    name: Quality & Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Run TypeScript type checking
        run: npx tsc --noEmit

      - name: Security audit (npm)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: SAST with Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/typescript
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # Job 2: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality-and-security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests with coverage
        run: npm run test:unit
        env:
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 3: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality-and-security]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ecode_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/ecode_test

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/ecode_test
          REDIS_URL: redis://localhost:6379

  # Job 4: Build Validation
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build client (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build artifacts
        run: |
          test -d dist/public || (echo "Build failed: dist/public not found" && exit 1)
          test -f dist/public/index.html || (echo "Build failed: index.html not found" && exit 1)
          echo "Build artifacts verified successfully"

      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sh dist/public | cut -f1)
          echo "Bundle size: $BUNDLE_SIZE"
          # Warning if bundle > 5MB (adjust as needed)
          SIZE_BYTES=$(du -sb dist/public | cut -f1)
          if [ $SIZE_BYTES -gt 5242880 ]; then
            echo "::warning::Bundle size exceeds 5MB: $BUNDLE_SIZE"
          fi

  # Job 5: Deploy to Replit (Staging)
  deploy-staging:
    name: Deploy to Replit Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://e-code.replit.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Replit deployment
        run: |
          echo "🚀 Triggering Replit deployment..."
          # Replit auto-deploys on push to main branch
          # This step documents the deployment process

          # If using Replit API (requires REPLIT_TOKEN):
          # curl -X POST "${{ env.REPLIT_API_URL }}" \
          #   -H "Authorization: Bearer ${{ secrets.REPLIT_TOKEN }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"query": "mutation { deployRepl(replId: \"${{ secrets.REPL_ID }}\") { id status } }"}'

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for Replit deployment to complete..."
          sleep 60  # Replit typically takes 30-90 seconds

      - name: Health check
        run: |
          echo "🏥 Running health checks..."
          MAX_RETRIES=10
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://e-code.replit.app/health/liveness || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_STATUS)"
              break
            else
              echo "⚠️  Health check failed (HTTP $HTTP_STATUS), retrying... ($((RETRY_COUNT + 1))/$MAX_RETRIES)"
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 10
            fi
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ Health check failed after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Smoke tests
        run: |
          echo "🧪 Running smoke tests..."

          # Test API endpoint
          API_RESPONSE=$(curl -s https://e-code.replit.app/api/health)
          echo "API Health: $API_RESPONSE"

          # Test metrics endpoint
          METRICS_RESPONSE=$(curl -s https://e-code.replit.app/metrics | head -n 5)
          echo "Metrics available: Yes"

          echo "✅ Smoke tests passed"

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Staging deployment successful"
          else
            echo "❌ Staging deployment failed"
          fi

  # Job 6: Deploy to Replit (Production)
  deploy-production:
    name: Deploy to Replit Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    environment:
      name: production
      url: https://e-code.ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment tag
        run: |
          TAG="v$(date +%Y%m%d-%H%M%S)"
          git tag $TAG
          echo "DEPLOYMENT_TAG=$TAG" >> $GITHUB_ENV
          echo "Created deployment tag: $TAG"

      - name: Trigger Replit production deployment
        run: |
          echo "🚀 Triggering Replit production deployment..."
          echo "Deployment tag: ${{ env.DEPLOYMENT_TAG }}"

          # Replit production deployment
          # Configure via Replit Dashboard > Deployments > Production Branch

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for production deployment..."
          sleep 90

      - name: Production health check
        run: |
          echo "🏥 Running production health checks..."
          MAX_RETRIES=15
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://e-code.ai/health/liveness || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Production health check passed"
              break
            else
              echo "⚠️  Retrying... ($((RETRY_COUNT + 1))/$MAX_RETRIES)"
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 15
            fi
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ Production health check failed"
            exit 1
          fi

      - name: Production smoke tests
        run: |
          echo "🧪 Running production smoke tests..."

          # Critical path tests
          curl -f https://e-code.ai/health/readiness || exit 1
          curl -f https://e-code.ai/health/liveness || exit 1
          curl -f https://e-code.ai/api/health || exit 1

          echo "✅ Production smoke tests passed"

      - name: Update deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ PRODUCTION DEPLOYMENT SUCCESSFUL"
            echo "🏷️  Tag: ${{ env.DEPLOYMENT_TAG }}"
            echo "🌐 URL: https://e-code.ai"
          else
            echo "❌ PRODUCTION DEPLOYMENT FAILED"
            echo "🚨 Rollback may be required"
          fi

  # Job 7: Performance Monitoring
  performance-monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-staging]
    if: github.event_name == 'push'

    steps:
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://e-code.replit.app
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Check performance metrics
        run: |
          echo "📊 Performance metrics collected"
          echo "View results in GitHub Actions artifacts"

# Reusable notification workflow
  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Deployment notification
        run: |
          echo "📢 Deployment pipeline completed"
          echo "Staging: ${{ needs.deploy-staging.result }}"
          echo "Production: ${{ needs.deploy-production.result }}"
