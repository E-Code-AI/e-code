version: '3.8'

services:
  app:
    build: .
    container_name: ecode-app
    ports:
      - "80:5000"  # Map external port 80 to internal port 5000
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      # SECURITY: Redis password MUST be set in production - no fallback
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_NETWORK=ecode-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # SECURITY: Run as non-root user
    user: "1001:1001"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./attached_assets:/app/attached_assets
      # SECURITY: Docker socket access via socket-proxy for isolation
      # For full Docker access, use a docker-socket-proxy container instead
      # - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: ecode-postgres
    environment:
      - POSTGRES_DB=${PGDATABASE:-ecode}
      - POSTGRES_USER=${PGUSER:-ecode_user}
      - POSTGRES_PASSWORD=${PGPASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-ecode_user} -d ${PGDATABASE:-ecode}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecode-redis
    # SECURITY: Redis password MUST be set - no fallback allowed
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: ecode-nginx
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecode-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  ecode-network:
    driver: bridge
    name: ecode-network