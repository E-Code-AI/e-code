# E-Code Platform - Replit Reserved VM Configuration
# Use this for deployment on Replit Reserved VM with Docker socket access
#
# Prerequisites:
# 1. Reserved VM must have Docker installed
# 2. Docker socket must be accessible at /var/run/docker.sock
# 3. User must have permissions to access Docker socket
#
# Deploy with: docker-compose -f docker-compose.replit-vm.yml up -d

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecode-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - DEPLOYMENT_MODE=single-vm
      - KUBERNETES_ENABLED=false
      - EXECUTION_MODE=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_NETWORK=ecode-network
      - BASE_URL=https://e-code.ai
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./attached_assets:/app/attached_assets
      - ./storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    user: "1000:1000"

  postgres:
    image: postgres:15-alpine
    container_name: ecode-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${PGDATABASE:-ecode}
      - POSTGRES_USER=${PGUSER:-ecode_user}
      - POSTGRES_PASSWORD=${PGPASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-ecode_user} -d ${PGDATABASE:-ecode}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecode-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - ecode-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  ecode-network:
    driver: bridge
    name: ecode-network
