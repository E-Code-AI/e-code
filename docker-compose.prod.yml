version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecode-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://ecode:${POSTGRES_PASSWORD}@postgres:5432/ecode
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DEPLOYMENT_MODE=single-vm
      - KUBERNETES_ENABLED=false
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
    volumes:
      - app-storage:/app/storage
      - docker-certs-client:/certs/client:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ecode-network

  postgres:
    image: postgres:15-alpine
    container_name: ecode-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ecode
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ecode
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecode -d ecode"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecode-network

  redis:
    image: redis:7-alpine
    container_name: ecode-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecode-network

  docker:
    image: docker:24-dind
    container_name: ecode-docker
    restart: unless-stopped
    privileged: true  # Required for Docker-in-Docker
    security_opt:
      - seccomp:unconfined
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - docker-certs-ca:/certs/ca
      - docker-certs-client:/certs/client
      - docker-data:/var/lib/docker
    networks:
      - ecode-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local
  docker-certs-ca:
    driver: local
  docker-certs-client:
    driver: local
  docker-data:
    driver: local

networks:
  ecode-network:
    driver: bridge
