# E-Code Nginx Configuration
# Supports: standalone, Docker, and Kubernetes deployments

# Upstream definitions - change based on deployment mode
# For standalone/Replit: localhost:5000
# For Docker Compose: app:5000
# For Kubernetes: ecode-app-service:5000
upstream ecode_backend {
    # Default: Docker Compose service name
    server app:5000;
    
    # Fallback servers for high availability (Kubernetes)
    # server ecode-app-service:5000 backup;
    
    keepalive 32;
}

server {
    listen 80;
    server_name e-code.ai www.e-code.ai;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name e-code.ai www.e-code.ai;

    # SSL Certificate paths - use environment variables for flexibility
    # For Docker: Mount certificates and set paths via environment
    # For Kubernetes: Use cert-manager with Ingress instead
    # Default paths work with certbot/Let's Encrypt standard layout
    # Override with: SSL_CERT_PATH and SSL_KEY_PATH environment variables
    # In Docker: docker run -e SSL_CERT_PATH=/custom/path/cert.pem ...
    # Or use envsubst: envsubst '$SSL_CERT_PATH $SSL_KEY_PATH' < nginx.conf.template > nginx.conf
    ssl_certificate ${SSL_CERT_PATH:-/etc/letsencrypt/live/e-code.ai/fullchain.pem};
    ssl_certificate_key ${SSL_KEY_PATH:-/etc/letsencrypt/live/e-code.ai/privkey.pem};
    
    # SSL optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # ==========================================================================
    # CONTENT SECURITY POLICY (CSP)
    # ==========================================================================
    # For production, replace 'unsafe-inline' in style-src with nonces or hashes.
    # 
    # NONCE-BASED APPROACH (Recommended):
    # The application should generate a unique nonce per request and:
    # 1. Add the nonce to all inline <script> and <style> tags
    # 2. Pass the nonce to nginx via a response header (X-CSP-Nonce)
    # 3. Use nginx's sub_filter or Lua module to inject nonce into CSP header
    #
    # HASH-BASED APPROACH (For static inline scripts):
    # 1. Calculate SHA256 hash of each inline script/style content
    # 2. Add hashes to CSP: 'sha256-BASE64HASH'
    # 3. Update hashes when inline content changes
    #
    # BEST PRACTICE: Move all inline scripts to external files where possible.
    # This eliminates the need for 'unsafe-inline' entirely.
    #
    # Current policy uses 'strict-dynamic' which allows scripts loaded by
    # trusted scripts, reducing the attack surface while maintaining functionality.
    # ==========================================================================
    # TODO: Replace 'unsafe-inline' with nonces or hashes in styles once build pipeline generates them
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'strict-dynamic' https:; style-src 'self' https: 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    location / {
        proxy_pass http://ecode_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # Timeouts for long-running requests (AI operations)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ws {
        proxy_pass http://ecode_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSocket timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Health check endpoint (for load balancers)
    location /health {
        proxy_pass http://ecode_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    client_max_body_size 100M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/x-javascript image/svg+xml;

    # Static file caching (1 year for immutable assets)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://ecode_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # HTML files - no cache (for SPA routing)
    location ~* \.html$ {
        proxy_pass http://ecode_backend;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}