<!DOCTYPE html>
<html>
<head>
  <title>Test Modèles Gemini UI</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #1a1a1a; color: #fff; }
    .model { background: #2a2a2a; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #3b82f6; }
    .model h3 { margin: 0 0 10px 0; color: #3b82f6; }
    .model p { margin: 5px 0; color: #aaa; }
    .badge { display: inline-block; padding: 4px 8px; background: #10b981; color: white; border-radius: 4px; font-size: 12px; margin-left: 8px; }
    .error { color: #ef4444; }
    .success { color: #10b981; }
  </style>
</head>
<body>
  <h1>🧪 Test des Modèles AI dans l'UI</h1>
  <div id="status">Chargement...</div>
  <div id="models"></div>
  
  <script>
    async function testModels() {
      const statusDiv = document.getElementById('status');
      const modelsDiv = document.getElementById('models');
      
      try {
        const response = await fetch('http://localhost:5000/api/models');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        const models = data.models || [];
        
        statusDiv.innerHTML = `<span class="success">✅ ${models.length} modèles chargés depuis l'API</span>`;
        
        // Filtrer les modèles Gemini
        const geminiModels = models.filter(m => m.provider === 'gemini');
        
        modelsDiv.innerHTML = `
          <h2>Modèles Gemini (${geminiModels.length}/${models.length} total)</h2>
          ${geminiModels.map(model => `
            <div class="model">
              <h3>
                ${model.name} 
                <span class="badge">${model.id}</span>
                ${model.available ? '<span class="badge" style="background:#10b981">Disponible</span>' : ''}
              </h3>
              <p><strong>Provider:</strong> ${model.provider}</p>
              <p><strong>Description:</strong> ${model.description}</p>
              <p><strong>Max Tokens:</strong> ${model.maxTokens.toLocaleString()}</p>
              <p><strong>Streaming:</strong> ${model.supportsStreaming ? 'Oui ✓' : 'Non ✗'}</p>
              <p><strong>Coût:</strong> $${model.costPer1kTokens} / 1K tokens</p>
            </div>
          `).join('')}
          
          <h2>Tous les Modèles (${models.length})</h2>
          ${models.map(m => `<div style="padding:5px; border-bottom:1px solid #333;">${m.provider}: ${m.name}</div>`).join('')}
        `;
        
      } catch (error) {
        statusDiv.innerHTML = `<span class="error">❌ Erreur: ${error.message}</span>`;
        modelsDiv.innerHTML = '';
      }
    }
    
    testModels();
  </script>
</body>
</html>
